<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bind the Air</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back_ios_new,arrow_forward_ios" />

<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="bg.css">

<script src="/socket.io/socket.io.js"></script>

<!-- jsPDF & html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<!-- ========================================================== -->
<!-- bg -->
<!-- ========================================================== -->
<div id="bg"></div>


<!-- ========================================================== -->
<!-- Book -->
<!-- ========================================================== -->
<div class="book" id="currentPage">
  <div id="pages-scale">
    <div id="pages" class="variBtn">

      <div id="cover-front">
        <h1>Dear Reader</h1><br>
        <p style="font-family: 'FKGroteskNeueTrial-Bold'; margin-block-start: 0; margin-block-end: 0;">
          Travel across the globe and leave your message in the air. The pages covering the sky will be bound into a collective volume on your mobile. Together, as a global community, we bind the air into a shared book — turning borders into pages that connect us. 
        </p>
      </div>
      
      <div id="cover-back">
        <p>
          Published By Halim Lee  
        </p>
      </div>

    </div>
    <span id="pageIndicator" class="variBtn"></span>
  </div>
</div>


<!-- ========================================================== -->
<!-- Side: Pre/Next Buttons -->
<!-- ========================================================== -->
<button id="prevBtn"></button>
<button id="nextBtn"></button>
<!-- <button id="prevBtn"><span class="material-symbols-outlined variBtn">arrow_back_ios_new</span></button>
<button id="nextBtn"><span class="material-symbols-outlined variBtn">arrow_forward_ios</span></button> -->


<!-- ========================================================== -->
<!-- Bottom: Menu -->
<!-- ========================================================== -->
<input type="range" id="pageSlider" min="0" max="65" value="0">

<button id="title" class="variBtn">Bind the Air</button>
<button id="saveBtn" class="variBtn">Save PDF</button>


<!-- ========================================================== -->
<script>
const socket = io();

const totalPages = 66;
const inputsCount = 180;
let currentPage = 0;

const coverContainer = document.getElementById("cover-front");
const backcoverContainer = document.getElementById("cover-back");
const inputsContainer = document.getElementById("pages");
const pageIndicator = document.getElementById("pageIndicator");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const pageSlider = document.getElementById("pageSlider");

// input 생성
const inputElements = [];
let rowContainer = null;

for (let i = 0; i < inputsCount; i++) {

  // 15개마다 새로운 div 생성
  if (i % 15 === 0) {
    rowContainer = document.createElement("div");
    rowContainer.classList.add("line");
    inputsContainer.appendChild(rowContainer);
  }

  const input = document.createElement("span");
  input.contentEditable = "true"; 
  input.dataset.index = i;
  input.classList.add("letter");
  // inputsContainer.appendChild(input);
  rowContainer.appendChild(input);
  inputElements.push(input);

  let isComposing = false;
  let composedText = "";

  // compositionstart
  input.addEventListener("compositionstart", () => {
    isComposing = true;
    composedText = "";
  });

  // compositionupdate
  input.addEventListener("compositionupdate", (e) => {
    composedText = e.data || "";
  });

  // compositionend
  input.addEventListener("compositionend", (e) => {
    isComposing = false;
    const text = e.data || composedText;
    composedText = "";

    if (!text || text.trim().length === 0) return;

    const chars = [...text];
    let serverIndex = parseInt(input.dataset.index);      // 서버 저장용
    let focusIndex = inputElements.indexOf(input);        // 포커스 이동용

    chars.forEach((ch) => {
      if (serverIndex >= inputElements.length) return;
      if (focusIndex >= inputElements.length) return;

      const target = inputElements[focusIndex];
      target.value = ch;
      target.classList.add("input-texted");

      // 서버 저장
      socket.emit("inputChange", {
        pageId: currentPage,
        inputIndex: serverIndex,
        value: ch
      });

      serverIndex++;
      focusIndex++;
    });

    // 마지막 글자 뒤로 포커스 이동
    // if (focusIndex < inputElements.length) {
    //   setTimeout(() => {
    //     inputElements[focusIndex].focus();
    //     inputElements[focusIndex].classList.add("letter-selected");
    //   }, 0);
    // } else {
    //   setTimeout(() => {
    //     inputElements[inputElements.length - 1].focus();
    //     inputElements[inputElements.length - 1].classList.add("letter-selected");
    //   }, 0);
    // }
    if (focusIndex < inputElements.length) {
      inputElements[focusIndex].focus();
    } else {
      inputElements[inputElements.length - 1].focus();
    }
  });

  // 포커스 또는 클릭 시 selected 상태 적용
  const applySelected = () => {
    inputElements.forEach(i => i.classList.remove("letter-selected"));
    input.classList.add("letter-selected");
    // input.select();
    // 커서 전체 선택
    const range = document.createRange();
    range.selectNodeContents(input);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  };
  input.addEventListener("focus", applySelected);
  input.addEventListener("click", applySelected);

  // 일반 input 이벤트
  input.addEventListener("input", (e) => {
    if (isComposing) return;

    const index = parseInt(e.target.dataset.index);
    const value = e.target.textContent;

    if (currentPage >= 1 && currentPage <= totalPages - 2) {
      socket.emit("inputChange", {
        pageId: currentPage,
        inputIndex: index,
        value
      });
    }

    if (value.trim() !== "") {
      input.classList.add("input-texted");
    } else {
      input.classList.remove("input-texted");
    }

    // 한 글자 입력 후 자동 이동
    const currentIndex = inputElements.indexOf(input);
    if (value.length === 1 && currentIndex < inputElements.length - 1) {
      const nextInput = inputElements[currentIndex + 1];
      // nextInput.focus();
      const range = document.createRange();
      const sel = window.getSelection();
      range.selectNodeContents(nextInput);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      nextInput.classList.add("letter-selected");
    }
  });

  // 백스페이스 처리
  input.addEventListener("keydown", (e) => {
    const currentIndex = inputElements.indexOf(input);

    if (e.key === "Backspace") {
      if (input.value !== "") {
        // 현재 글자 삭제 + 서버 반영
        socket.emit("inputChange", {
          pageId: currentPage,
          inputIndex: currentIndex,
          value: ""
        });
        input.value = "";
        return;
      }

      // 이전 input 존재 시
      if (currentIndex > 0) {
        e.preventDefault();
        const prev = inputElements[currentIndex - 1];
        if (prev) {
          // prev.focus();
          const range = document.createRange();
          const sel = window.getSelection();

          range.selectNodeContents(prev);
          range.collapse(false); // 끝으로 이동
          sel.removeAllRanges();
          sel.addRange(range);

          prev.classList.add("letter-selected");
          // prev.select();
          prev.value = "";

          socket.emit("inputChange", {
            pageId: currentPage,
            inputIndex: currentIndex - 1,
            value: ""
          });
        }
      }
    }
  });
}

// 페이지 로드
function loadPage(pageId) {
  if (pageId < 0) pageId = 0;
  if (pageId >= totalPages) pageId = totalPages - 1;
  currentPage = pageId;

  if (currentPage === 0 || currentPage === totalPages - 1) {
    pageIndicator.style.display = "none";
  } else {
    pageIndicator.style.display = "inline-block";
    pageIndicator.textContent = `${currentPage}`;
  }

  pageSlider.value = currentPage;

  if (currentPage === 0) {
    coverContainer.style.display = "block"; 
    backcoverContainer.style.display = "none"; 
    inputElements.forEach(input => input.style.display = "none");
  } else if (currentPage === totalPages - 1) {
    coverContainer.style.display = "none"; 
    backcoverContainer.style.display = "block"; 
    inputElements.forEach(input => input.style.display = "none");
  } else {
    coverContainer.style.display = "none"; 
    backcoverContainer.style.display = "none"; 
    inputElements.forEach(input => input.style.display = "block");

    socket.emit("requestPlaneData", currentPage);
  }
}

// 서버에서 페이지 데이터 수신
socket.on("loadPlaneData", ({ pageId, data }) => {
  if (pageId !== currentPage) return;
  for (let i = 0; i < inputsCount; i++) {
    inputElements[i].textContent = data[`input${i}`] || '';
  }
});

// 다른 브라우저에서 데이터 변경 시 실시간 반영
socket.on("updateInput", ({ pageId, inputIndex, value }) => {
  if (pageId === currentPage) {
    const idx = parseInt(inputIndex);
    const input = inputElements[idx];
    if(input) input.textContent = value || '';
  }
});

// Prev/Next 버튼
prevBtn.addEventListener("click", () => loadPage(currentPage - 1));
nextBtn.addEventListener("click", () => loadPage(currentPage + 1));
pageSlider.addEventListener("input", (e) => loadPage(parseInt(e.target.value)));

// 초기 페이지
loadPage(0);
</script>

<script type="text/javascript" src="m_bg.js"></script>
<script type="text/javascript" src="m_floater.js"></script>
<script type="text/javascript" src="m_pdf.js"></script>
<script type="text/javascript" src="m_scale.js"></script>

</body>
</html>
