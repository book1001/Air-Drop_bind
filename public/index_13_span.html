<style>
  html,body {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  body {
    margin: 0;
    background: black;
    overflow: hidden;
    cursor: grab;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 0;
    pointer-events: none;
  }

  #cssRenderer {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;
    background: transparent !important;
  }

  /* --- plane-wrapper --- */
  .plane-wrapper {
    display: grid;
    /* grid-template-columns: repeat(10, 1fr);
    grid-template-rows: repeat(12, 1fr); */
    backface-visibility: hidden;
    transform-style: preserve-3d;
    will-change: transform;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
    -moz-osx-font-smoothing: grayscale;

    grid-auto-columns: 1fr; 
    grid-auto-rows: 1fr; 
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr; 
    grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr; 
    gap: 0px 0px; 
    grid-template-areas: 
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."
      ". . . . . . . . ."; 
    /* background: red; */
  }

  /* --- input field --- */
  .inputPlane {
    width: 100%;
    height: 100%;
    /* width: 6px;
    height: 9px; */
    padding: 0;
    margin: 0;
    font-size: 11px;
    line-height: 9px;
    text-align: center;
    font-family: FKGroteskMonoTrial-Regular;
    text-transform: uppercase;
    border: 1px solid white;
    border: none;
    color: white;
    font-family: 'FKGroteskMonoTrial-Regular', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
    text-shadow: 0 0 1px #ffffff;
    background: transparent;
    pointer-events: auto;
    outline: none;

    /* ✨ 핵심: 흐림 제거 */
    -webkit-font-smoothing: none !important;
    text-rendering: geometricPrecision;
    filter: none;
    transform: translate3d(0, 0, 0) scale(1.0001);
    backface-visibility: hidden;

    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  /* 포커스 시에도 blur 안 생김 */
  .inputPlane:focus {
    background: transparent;
    border: none;
    outline: none;
    filter: none;
    transform: translate3d(0, 0, 0) scale(1.0001);
  }

  .input-selected {
    border: 1px solid yellow !important;
    color: transparent !important;
    /* background: yellow !important; */
  }

  .input-texted {
    position: relative;
    /* animation: float 3s ease-in-out infinite; */
    /* animation: float-3d 3s infinite ease-in-out alternate; */
  }


  .float1 {
    animation: float 3s ease-in-out infinite;
    animation-delay: 0s;
  }

  .float2 {
    animation: float 3s ease-in-out infinite;
    animation-delay: 0.5s;
  }

  .float3 {
    animation: float 3s ease-in-out infinite;
    animation-delay: 1s;
  }

  @keyframes float {
      0% {
          transform: translateY(0);
      }

      50% {
          transform: translateY(-20px);
      }

      100% {
          transform: translateY(0);
      }
  }

  @keyframes float-3d {
    from {
      transform: translateZ(0) rotateX(0deg); /* Starting position and rotation */
    }
    to {
      transform: translateZ(20px) rotateX(10deg); /* Floating closer and tilting */
    }
  }

  #info {
    position: fixed; 
    top: 3px;
    left: 9px;
    width: 550px;
    z-index: 3; 
    /* font-family: 'FKGroteskNeueTrial-Bold'; */

    color: red;
    font-size: 36px; */

    letter-spacing: 0.027em;
    text-transform: uppercase;
    text-align: justify; */

    font-size: 24px;
    background: black;
    text-transform: uppercase; */

    font-size: 19px;
    transition: color 2s ease, text-shadow 2s ease;

    text-shadow: 0 0 6px #ffffff; */
  }

    Travel across the globe and leave your message in the air. The pages covering the sky will be bound into a collective volume on your mobile. Together, as a global community, we bind the air into a shared book — turning borders into pages that connect us.

  <script type="text/javascript" src="bg.js"></script>


  <script type="module">
    import * as THREE from 'three';
    import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    
    const socket = io();
    const inputsCount = 180;
    let allInputs = [];
    let planeCount = 0; // 실제 plane 수

    // camera 회전 제어용
    let targetQuaternion = new THREE.Quaternion();
    let isCameraMoving = false;
    let keyRotation = new THREE.Quaternion();

    let loadedFont=null;
    // new FontLoader().load('font/FK Grotesk SemiMono Trial_Regular.json', f => { loadedFont=f; init(); animate(); });

    let font1 = null;
    let font2 = null;

    new FontLoader().load('font/FKGroteskSemiMonoTrial_Regular.json', f => {
        font1 = f;
        checkAllFontsLoaded();
    });

    new FontLoader().load('font/ReadyActiveTest-Light5.json', f => {
        font2 = f;
        checkAllFontsLoaded();
    });

    function checkAllFontsLoaded() {
        if(font1 && font2) {
            init();
            animate();
        }
    }



    let scene, camera, webGLRenderer, cssRenderer, sphereGroup, backgroundMesh, texture, ctx, canvas;
    let rotationX=0, rotationY=0;
    let keyRotationX = 0, keyRotationY = 0; // Cmd/Ctrl 화살표용
    const keys={ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false};
    const speed=0.02;

    const gltfLoader=new GLTFLoader();
    const textMeshes = [];  // animate에서 회전시키기 위해 저장
    let cloudSouth;


    // ✅ 드래그 상태 변수
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;

    let lastUpdate = 0;


    let autoRotateSpeed = 0.05; // 자동 회전 속도
    let manualRotation = new THREE.Vector2(0,0); // Ctrl/Cmd 회전 저장


    function focusCameraOnInput(input) {
      if (!input) return; // input이 없으면 종료

      const object = input.__threeObj;
      if (!object) return;

      // 값과 관계없이 포커스된 객체를 바라보도록
      const targetDir = object.position.clone().normalize();
      const m = new THREE.Matrix4().lookAt(new THREE.Vector3(0,0,0), targetDir, new THREE.Vector3(0,1,0));
      targetQuaternion.setFromRotationMatrix(m);
      isCameraMoving = true;
    }


    // span 전체 선택 기능 (input.select() 대체)
    function selectSpanText(el) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

        
    // --- Init ---
    function init(){
      scene=new THREE.Scene();
      // camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
      camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000); // 1000 → 2000

      camera.position.set(0,0,0);

      webGLRenderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
      webGLRenderer.setClearColor(0x000000, 0);
      webGLRenderer.setSize(window.innerWidth,window.innerHeight);
      document.body.appendChild(webGLRenderer.domElement);

      cssRenderer=new CSS3DRenderer();
      cssRenderer.setSize(window.innerWidth,window.innerHeight);
      cssRenderer.domElement.id="cssRenderer";
      document.body.appendChild(cssRenderer.domElement);

      sphereGroup=new THREE.Group();
      scene.add(sphereGroup);
      scene.background = null;

      // background canvas
      canvas = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      texture.encoding = THREE.sRGBEncoding;
      texture.needsUpdate = true;
      
      const radius=500;
      const geo=new THREE.SphereGeometry(radius,64,64);
      // const mat=new THREE.MeshBasicMaterial({map:texture,side:THREE.BackSide});
      // 완전 투명한 배경만 남기려면:
      const mat = new THREE.MeshBasicMaterial({
        transparent: true,
        opacity: 0,
        side: THREE.BackSide
      });

      const sphereMesh=new THREE.Mesh(geo,mat);
      sphereGroup.add(sphereMesh);

       // --- 3D Text letters on sphere ---
      const letters = ['B','I','N','D','T','H','E','A','I','R'];
      const baseOffset = 50; // 기본 구 내부 거리

      if (font2) {
        letters.forEach(letter => {
          const textGeo = new TextGeometry(letter, {
            font: font2,
            size: 150,
            height: 2,
            curveSegments: 4,
            bevelEnabled: false
          });
          textGeo.computeBoundingBox();
          const bbox = textGeo.boundingBox;
          const textCenter = new THREE.Vector3(
            (bbox.max.x + bbox.min.x)/2,
            (bbox.max.y + bbox.min.y)/2,
            (bbox.max.z + bbox.min.z)/2
          );
          textGeo.translate(-textCenter.x, -textCenter.y, -textCenter.z);

          const material = new THREE.MeshBasicMaterial({ 
            color: 0xffffff,
            transparent: true,
            opacity: 0 // 처음에는 안보이도록
          });
          const textMesh = new THREE.Mesh(textGeo, material);

          // 랜덤 회전 속도
          const speed = (Math.random() * 0.015) + 0.005;
          textMesh.userData.rotationSpeed = Math.random() < 0.5 ? speed : -speed;

          // fade 효과와 위치 이동을 위한 유저 데이터
          textMesh.userData.fadeSpeed = 0.005 + Math.random() * 0.01; // 0.005~0.015
          textMesh.userData.fadeDirection = 1; // 1: 나타남, -1: 사라짐
          textMesh.userData.startDelay = Math.random() * 2000; // 시작 시간 랜덤 (ms)
          textMesh.userData.lastChangeTime = performance.now();

          // 랜덤 위치 설정 함수 → mesh를 인자로 받음
          textMesh.userData.setRandomPosition = function(mesh) {
            const offset = baseOffset + Math.random() / 20;
            const phi = Math.random() * Math.PI;
            const theta = Math.random() * 2 * Math.PI;
            mesh.position.set(
              (radius - offset) * Math.sin(phi) * Math.cos(theta),
              (radius - offset) * Math.cos(phi),
              (radius - offset) * Math.sin(phi) * Math.sin(theta)
            );
            mesh.lookAt(new THREE.Vector3(0,0,0));
          };

          // 초기 위치 → textMesh를 전달
          textMesh.userData.setRandomPosition(textMesh);

          sphereGroup.add(textMesh);
          textMeshes.push(textMesh);
        });
      }





      // clouds (남극만 예시 - 북극은 주석 처리 가능)
      gltfLoader.load('model/cloud.glb', (gltf) => {
        cloudSouth = gltf.scene;
        cloudSouth.traverse((child)=>{ if(child.isMesh){ child.material = new THREE.MeshBasicMaterial({ map: child.material.map, side: THREE.DoubleSide, transparent: true, opacity: 0.8, depthWrite:false, alphaTest:0.5 }); }});
        cloudSouth.scale.set(50,50,50);
        cloudSouth.position.set(0,-radius,0);
        sphereGroup.add(cloudSouth);
      });




      // --- Grid + Planes ---
      const latLines=6, lonLines=16;
      const lineThickness = 1;
      const verticalLines=[], horizontalLines=[];
      const inputsPerPlane = inputsCount;

      function createTubeFromPoints(points, radius=1, radialSegments=6){
        class CustomCurve extends THREE.Curve { constructor(points){ super(); this.points=points; } getPoint(t){ const idx=t*(this.points.length-1); const i=Math.floor(idx); const frac=idx-i; if(i>=this.points.length-1) return this.points[this.points.length-1]; return new THREE.Vector3().lerpVectors(this.points[i], this.points[i+1], frac); } }
        const curve = new CustomCurve(points);
        const geom = new THREE.TubeGeometry(curve, points.length*2, radius, radialSegments, false);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        return new THREE.Mesh(geom, mat);
      }

      
      for(let i=0;i<=lonLines;i++){
        const phi = (i/lonLines)*2*Math.PI;
        const points=[];
        for(let j=0;j<=latLines;j++){
          const theta=(j/latLines)*Math.PI;
          const x=radius*Math.sin(theta)*Math.cos(phi);
          const y=radius*Math.cos(theta);
          const z=radius*Math.sin(theta)*Math.sin(phi);
          points.push(new THREE.Vector3(x,y,z));
        }
        verticalLines.push(points);
        sphereGroup.add(createTubeFromPoints(points,lineThickness));
      }
      for(let j=0;j<=latLines;j++){
        const theta=(j/latLines)*Math.PI;
        const points=[];
        for(let i=0;i<=lonLines;i++){
          const phi=(i/lonLines)*2*Math.PI;
          const x=radius*Math.sin(theta)*Math.cos(phi);
          const y=radius*Math.cos(theta);
          const z=radius*Math.sin(theta)*Math.sin(phi);
          points.push(new THREE.Vector3(x,y,z));
        }
        horizontalLines.push(points);
        sphereGroup.add(createTubeFromPoints(points,lineThickness));
      }



      // planes + CSS3D inputs 생성 (원본 로직 유지)
      const planeWidths=[100,100,150,150,100,100];
      const planeHeights=[100,240,240,240,240,100];
      let inputCount = 1;
      let faceCount = 1;

      for(let j=1;j<latLines-1;j++){
        const planeW=planeWidths[j%planeWidths.length];
        const planeH=planeHeights[j%planeHeights.length];

        for(let i=0;i<lonLines;i++){
          const p00 = verticalLines[i][j];
          const p01 = verticalLines[i][j+1];
          const p10 = verticalLines[i+1][j];
          const p11 = verticalLines[i+1][j+1];

          const center=new THREE.Vector3().addVectors(p00,p01).add(p10).add(p11).multiplyScalar(0.25);

          const div=document.createElement('div');
          div.className='plane-wrapper';
          div.style.width=planeW+'px';
          div.style.height=planeH+'px';



          // ✅ ✅ ✅ ✅ ✅ ✅ ✅ Input Creates
          for(let k=0;k<inputsCount;k++){
            const input=document.createElement('span');
            input.contentEditable = "true"; 
            input.className='inputPlane';
            input.id='input'+(inputCount);
            div.appendChild(input);
            allInputs.push(input);

            const pageId = Math.floor((inputCount-1)/inputsCount) + 1; // 1부터 시작
            const inputIndex = (inputCount-1) % inputsCount;
            setupInput(input, pageId, inputIndex);
            inputCount++;
            // input → camera 연결
            input.__threeObj = null; // 나중에 object 연결
            input.addEventListener('input', () => { if(input.textContent.trim()!=='') focusCameraOnInput(input); });
        
          }
          // ✅ object 선언
          const object = new CSS3DObject(div);
          object.position.copy(center);
          object.lookAt(0, 0, 0);
          sphereGroup.add(object);

          // input ↔ object 연결
          div.querySelectorAll('input').forEach(inp => inp.__threeObj = object);


          if(font1){
            const textGeo = new TextGeometry(faceCount.toString(), {
              font: font1,
              size: 11,
              height: 0.3,
              curveSegments: 4,
              bevelEnabled: false
            });
            textGeo.computeBoundingBox();
            const bbox=textGeo.boundingBox;
            const textCenter = new THREE.Vector3(
              (bbox.max.x + bbox.min.x) / 2,
              // (bbox.max.y + bbox.min.y) * 4,
              (bbox.max.y + bbox.min.y) * 10,
              (bbox.max.z + bbox.min.z) / 2
            );
            textGeo.translate(-textCenter.x,-textCenter.y,-textCenter.z);
            const textMesh=new THREE.Mesh(textGeo,new THREE.MeshBasicMaterial({color:0xffffff}));
            textMesh.position.copy(center);
            textMesh.lookAt(camera.position);
            sphereGroup.add(textMesh);
          }

          faceCount++;
        }
      }

      planeCount = Math.ceil(allInputs.length/inputsCount);
      requestAllPages();


      // --- 카메라 회전 관리 ---
      isCameraMoving = false;
      targetQuaternion = new THREE.Quaternion();
      keyRotation.identity();

      function rotateCamera(deltaX, deltaY) {
        const qx = new THREE.Quaternion();
        const qy = new THREE.Quaternion();
        qx.setFromAxisAngle(new THREE.Vector3(1,0,0), deltaY);
        qy.setFromAxisAngle(new THREE.Vector3(0,1,0), deltaX);

        keyRotation.multiplyQuaternions(qy, keyRotation);
        keyRotation.multiplyQuaternions(qx, keyRotation);

        clampEuler(keyRotation);
      }

      function clampEuler(quat){
        const euler = new THREE.Euler().setFromQuaternion(quat,'YXZ');
        const maxX = Math.PI/2 - 0.01;
        const minX = -Math.PI/2 + 0.01;
        euler.x = Math.max(minX, Math.min(maxX, euler.x));
        quat.setFromEuler(euler);
      }
      


      window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        webGLRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
      });

            
      // ✅ ✅ ✅ 마우스 드래그로 카메라 회전 기능 추가
          
      window.addEventListener('mousedown', (e) => {
        isDragging = true;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;

        const deltaX = e.clientX - prevMouseX;  // 좌우 이동 → y축 회전
        const deltaY = e.clientY - prevMouseY;  // 상하 이동 → x축 회전

        rotationY += deltaX * 0.005;
        rotationX += deltaY * 0.005;

        // 필요하면 상하 회전 제한
        const maxX = Math.PI/2 - 0.01;
        const minX = -Math.PI/2 + 0.01;
        rotationX = Math.max(minX, Math.min(maxX, rotationX));

        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      

    } // init()


    // --- Input Event Setup ---
    function setupInput(input, pageId, inputIndex){
      let isComposing = false;
      let composedText = "";

      // 입력 옵션
      // input.style.imeMode = 'active'; // IME 사용 가능
      // input.addEventListener("beforeinput", e => {
      //   if (e.inputType === "insertText" && e.data) {

      //     // ✅ 이미 글자가 있으면 더 입력하지 않음
      //     if (input.innerText.length >= 1) {
      //       e.preventDefault();
      //       moveToNextSpan(input);
      //       return;
      //     }

      //     // ✅ 영문, 숫자, 기호 등 1글자만 허용
      //     if (e.data.length > 1) e.data = e.data[0];
      //   }
      // });



       // ✅ IME(중국어, 한자 등) 입력 시작
      input.addEventListener("compositionstart", () => {
        isComposing = true;
        composedText = "";
      });

      // ✅ 조합 중 업데이트
      input.addEventListener("compositionupdate", (e) => {
        composedText = e.data || "";
      });

      input.addEventListener("compositionend", (e) => {
        isComposing = false;
        const text = e.data || composedText;
        composedText = "";

        if (!text || text.trim().length === 0) return;

        const chars = [...text];
        let serverIndex = inputIndex;                 // 서버 저장용
        let focusIndex = allInputs.indexOf(input);    // 포커스 이동용

        chars.forEach((ch) => {
          if (serverIndex >= allInputs.length) return;
          if (focusIndex >= allInputs.length) return;

          const target = allInputs[focusIndex];
          target.textContent = ch;
          target.classList.add("input-texted");

          // 서버에 저장
          socket.emit("inputChange", {
            pageId,
            inputIndex: serverIndex,
            value: ch
          });

          serverIndex++;
          focusIndex++;
        });

        // 마지막 글자 뒤로 포커스 이동
        if (focusIndex < allInputs.length) {
          allInputs[focusIndex].focus();
        } else {
          allInputs[allInputs.length - 1].focus();
        }
      });
      
      // ✅ 선택되거나 포커스되면 .input-selected 적용
      const applySelected = () => {
        allInputs.forEach(i => i.classList.remove('input-selected')); // 기존 제거
        input.classList.add('input-selected'); // 현재 input에 추가
        const range = document.createRange();
        range.selectNodeContents(input);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        // selectSpanText(input);
        // input.select(); // 전체 선택
      };

      input.addEventListener('focus', applySelected);
      input.addEventListener('click', applySelected);

      input.addEventListener('input', (e) => {
        if(isComposing) return;

        // ✅ 현재 상태 업데이트 서버로 전송
        const value = input.textContent;
        socket.emit('inputChange', { pageId, inputIndex, value });
        // socket.emit('inputChange', { pageId, inputIndex, value: input.value });

        // ✅ 스타일 토글
        input.textContent.trim() !== '' 
          ? input.classList.add('input-texted')
          : input.classList.remove('input-texted');

        const currentIndex = allInputs.indexOf(input);

        // ✅ 한 글자 입력 후 자동 이동
        if(input.textContent.length === 1 && currentIndex < allInputs.length - 1){
          const nextInput = allInputs[currentIndex + 1];
          // nextInput.focus();
          const range = document.createRange();
          const sel = window.getSelection();
          range.selectNodeContents(nextInput);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
          nextInput.classList.add('input-selected');
        }
      });

      input.addEventListener('keydown', (e) => {
        if(isComposing) return; // IME 입력 중에는 방향키 이동 금지
        const currentIndex = allInputs.indexOf(input);

        // ✅ 백스페이스 시 이전 input으로 이동
        if(e.key === 'Backspace' && input.textContent === '' && currentIndex > 0){
          e.preventDefault();
          input.textContent = '';
          // input.value = '';
          socket.emit('inputChange', { pageId, inputIndex, value: '' });
          const prev = allInputs[currentIndex - 1];
          if (prev) {
            // prev.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(prev);
            range.collapse(false); // 끝으로 이동
            sel.removeAllRanges();
            sel.addRange(range);

            prev.classList.add('input-selected');
            selectSpanText(prev);
            // prev.select(); // 전체 선택
            prev.textContent = '';
            // prev.value = '';
            socket.emit('inputChange', { pageId, inputIndex, value: '' });
          }
        }

        // ✅ 좌우 화살표 이동 지원 (기존 적용 유지)
        if(e.key === 'ArrowLeft' && currentIndex > 0){
          e.preventDefault();
          const prev = allInputs[currentIndex - 1];
          // prev.focus();
          const range = document.createRange();
          const sel = window.getSelection();
          range.selectNodeContents(prev);
          range.collapse(false); // 끝으로 이동
          sel.removeAllRanges();
          sel.addRange(range);
          prev.classList.add('input-selected');
        }

        if(e.key === 'ArrowRight' && currentIndex < allInputs.length - 1){
          e.preventDefault();
          const next = allInputs[currentIndex + 1];
          // next.focus();
          const range = document.createRange();
          const sel = window.getSelection();
          range.selectNodeContents(next);
          range.collapse(false); // 끝으로 이동
          sel.removeAllRanges();
          sel.addRange(range);  
          next.classList.add('input-selected');
        }

        // 🔹 ArrowUp → 위로 이동
        if(e.key === 'ArrowUp'){
          e.preventDefault();
          const up = allInputs[currentIndex - 15];
          if(up){
            // up.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(up);
            range.collapse(false); // 끝으로 이동
            sel.removeAllRanges();
            sel.addRange(range);  
            up.classList.add('input-selected');
          }
        }

        // 🔹 ArrowDown 또는 Enter → 아래로 이동
        if(e.key === 'ArrowDown'){
          e.preventDefault();
          const down = allInputs[currentIndex + 15];
          if(down){
            // down.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(down);
            range.collapse(false); // 끝으로 이동
            sel.removeAllRanges();
            sel.addRange(range);  
            down.classList.add('input-selected');
          }
        }


        // ✅ Command(mac) / Ctrl(Windows) + ArrowUp / ArrowDown
        if ((e.metaKey || e.ctrlKey) && e.keyCode === 37) { // ArrowLeft
          e.preventDefault();
          const prev = allInputs[currentIndex - 180];
          if(prev){
            // prev.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(prev);
            range.collapse(false); // 끝으로 이동
            sel.removeAllRanges();
            sel.addRange(range);
            prev.classList.add('input-selected');
            focusCameraOnInput(prev);
          }
        }

        if ((e.metaKey || e.ctrlKey) && e.keyCode === 39) { // ArrowRight
          e.preventDefault();
          const next = allInputs[currentIndex + 180];
          if(next){
            // next.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(next);
            range.collapse(false); // 끝으로 이동
            sel.removeAllRanges();
            sel.addRange(range);
            next.classList.add('input-selected');
            focusCameraOnInput(next);
          }
        }

        if ((e.metaKey || e.ctrlKey) && e.keyCode === 38) { // ArrowUp
          e.preventDefault();
          const up = allInputs[currentIndex - 2880];
          if(up){
            // up.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(up);
            range.collapse(false); // 끝으로 이동
            sel.removeAllRanges();
            sel.addRange(range);
            up.classList.add('input-selected');
            focusCameraOnInput(up);
          }
        }

        if ((e.metaKey || e.ctrlKey) && e.keyCode === 40) { // ArrowDown
          e.preventDefault();
          const down = allInputs[currentIndex + 2880];
          if(down){
            // down.focus();
            const range = document.createRange();
            const sel = window.getSelection();
            range.selectNodeContents(down);
            range.collapse(false); // 끝으로 이동
            sel.removeAllRanges();
            sel.addRange(range);
            down.classList.add('input-selected');
            focusCameraOnInput(down);
          }
        }

      });
      
    }

    function moveToNextSpan(current) {
      const idx = allInputs.indexOf(current);
      if (idx >= 0 && idx < allInputs.length - 1) {
        const next = allInputs[idx + 1];
        // next.focus();
        // 커서 위치 강제 조정
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(next);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    // function setupInput(input, pageId, inputIndex){
    //   let isComposing=false;
    //   input.addEventListener('compositionstart',()=>isComposing=true);
    //   input.addEventListener('compositionend',()=>isComposing=false);
    //   input.addEventListener('input',()=>{
    //     if(isComposing) return;
    //     socket.emit('inputChange',{pageId,inputIndex,value:input.value});
    //     input.value.trim()!=='' ? input.classList.add('input-texted') : input.classList.remove('input-texted');
    //   });
    // }

    // --- 요청 ---
    function requestAllPages(){
      for(let pageId=1; pageId<=planeCount; pageId++){
        socket.emit('requestPlaneData', pageId);
      }
    }

    // --- 서버에서 load ---
    socket.on('loadPlaneData', ({pageId,data})=>{
      for(let i=0;i<inputsCount;i++){
        const globalIndex=(pageId-1)*inputsCount + i;
        const input=allInputs[globalIndex];
        if(!input) continue;
        const value=data['input'+i]||'';
        input.textContent=value;
        value.trim()!=='' ? input.classList.add('input-texted') : input.classList.remove('input-texted');
      }
    });
    
    // --- 서버에서 실시간 update ---
    socket.on('updateInput', ({pageId,inputIndex,value})=>{
      const globalIndex=(pageId-1)*inputsCount + inputIndex;
      const input=allInputs[globalIndex];
      if(!input) return;
      input.textContent=value||'';
      if(value && value.trim()!=='') input.classList.add('input-texted');
      else input.classList.remove('input-texted');
    });


    // --- Animate ---
    const minRotationX = -Math.PI/2;
    const maxRotationX = Math.PI/2;

    function animate(time = 0){
      requestAnimationFrame(animate);
      if(keys.ArrowUp) rotationX -= speed;
      if(keys.ArrowDown) rotationX += speed;
      if(keys.ArrowLeft) rotationY -= speed;
      if(keys.ArrowRight) rotationY += speed;
      rotationX = Math.max(minRotationX, Math.min(maxRotationX, rotationX));
      sphereGroup.rotation.x = rotationX;
      sphereGroup.rotation.y = rotationY;
      if(cloudSouth) cloudSouth.rotation.y -= 0.001;

       // 부드럽게 카메라 회전
      if (isCameraMoving) {
        // 자동 회전: slerp로 부드럽게
        camera.quaternion.slerp(targetQuaternion, autoRotateSpeed);
        // 목표에 거의 도달하면 자동 회전 종료
        if (camera.quaternion.angleTo(targetQuaternion) < 0.001) {
          isCameraMoving = false;
        }
      } else {
        // 수동 회전 적용
        camera.rotateX(manualRotation.x);
        camera.rotateY(manualRotation.y);
        manualRotation.set(0, 0); // 적용 후 초기화
      }

      // 글자별 y축 회전
      const now = performance.now();
      textMeshes.forEach(mesh => {
        // y축 회전
        mesh.rotation.y += mesh.userData.rotationSpeed;

        const fullRotation = 2 * Math.PI;
        let normalizedRotation = Math.abs(mesh.rotation.y % fullRotation);

        // 회전 시작 → 빠른 fade in
        if (normalizedRotation < 0.2) {
          mesh.userData.fadeDirection = 1;   // 나타남
          mesh.userData.fadeSpeed = 0.08;    // 빠른 fade in
        }

        // 회전 끝 → 빠른 fade out
        if (normalizedRotation > fullRotation - 0.2) {
          mesh.userData.fadeDirection = -1;  // 사라짐
          mesh.userData.fadeSpeed = 0.08;    // 빠른 fade out
        }

        // fade in/out 적용
        if (mesh.userData.fadeDirection === 1) {
          mesh.material.opacity += mesh.userData.fadeSpeed;
          if (mesh.material.opacity > 1) mesh.material.opacity = 1;
        } else if (mesh.userData.fadeDirection === -1) {
          mesh.material.opacity -= mesh.userData.fadeSpeed;
          if (mesh.material.opacity <= 0) {
            mesh.material.opacity = 0;

            // 🔁 완전히 사라졌을 때: 새로운 위치에서 다시 나타나도록 설정
            mesh.userData.setRandomPosition(mesh);
            mesh.rotation.y = 0; // 회전 초기화
            mesh.userData.fadeDirection = 1; // 다시 fade in 시작
          }
        }
      });



      webGLRenderer.render(scene, camera);
      cssRenderer.render(scene, camera);
    }
